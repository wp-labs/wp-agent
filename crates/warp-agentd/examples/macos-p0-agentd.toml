# warp-agentd macOS P0 采集示例配置
#
# 用法（把本文件复制为 agentd 配置目录下的 agentd.toml，如 ~/.warp-insight/.warp-agentd/agentd.toml）：
#   target/debug/warp-agentd --config-dir <配置目录>
#
# 说明：
# - 采集列表：macOS P0（install.log / launchd / shutdown_monitor / fsck / wifi），
#   对应 data-plane models/wpl/mac 素材与 macos_agent 数据面规则；
# - install.log / launchd.log 体量大：默认 tail（只收新增行），需要首次回放历史时改 head；
# - 权限：部分路径需 root/Full Disk Access（wifi 需 admin 组）；读不到会失败/进 spool 重试；
# - .ips（新文件）、统一日志、OpenBSM audit 需 Phase 2 source，不在本文件内。
schema_version = "v1"

[telemetry.logs]
in_memory_buffer_bytes = 1048576
spool_dir = "state/spool/logs"

[telemetry.logs.output]
kind = "tcp"

[telemetry.logs.output.tcp]
addr = "127.0.0.1"
port = 9000
framing = "line"

# 可选：本地落盘调试（把 kind 改成 "file" 并填 [telemetry.logs.output.file]）
# [telemetry.logs.output.file]
# path = "log/warp-parse-records.ndjson"

[paths]
root_dir = "."
run_dir = "run"
state_dir = "state"
log_dir = "log"

# ---- macOS P0 file inputs ----
[[telemetry.logs.file_inputs]]
input_id = "macos_install_log"
path = "/var/log/install.log"
startup_position = "tail"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_launchd"
path = "/var/log/com.apple.xpc.launchd/launchd.log"
startup_position = "tail"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_shutdown_monitor"
path = "/var/log/shutdown_monitor.log"
startup_position = "tail"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_fsck"
path = "/var/log/fsck_apfs.log"
startup_position = "tail"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_wifi"
path = "/var/log/wifi.log"
startup_position = "tail"
multiline_mode = "none"
