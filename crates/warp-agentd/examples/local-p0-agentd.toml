# warp-agentd 本机验证运行配置（/tmp/warp-p0-agent/agentd.toml）
#
# 与 macos-p0-agentd.toml 的差别：
# - install.log 33 万行历史：tail（只收新增）；
# - launchd/shutdown_monitor/fsck/wifi 文件小：head 先回放真实历史一次，再转入 tail 增量；
# - 输出到本机 data-plane tcp 9000（macos_agent 规则 → macos-agent sink 文件）。
schema_version = "v1"

[telemetry.logs]
in_memory_buffer_bytes = 1048576
spool_dir = "state/spool/logs"

[telemetry.logs.output]
kind = "tcp"

[telemetry.logs.output.tcp]
addr = "127.0.0.1"
port = 9000
framing = "line"

[paths]
root_dir = "."
run_dir = "run"
state_dir = "state"
log_dir = "log"

# ---- macOS P0 file inputs ----
[[telemetry.logs.file_inputs]]
input_id = "macos_install_log"
path = "/var/log/install.log"
startup_position = "tail"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_launchd"
path = "/var/log/com.apple.xpc.launchd/launchd.log"
startup_position = "head"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_shutdown_monitor"
path = "/var/log/shutdown_monitor.log"
startup_position = "head"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_fsck"
path = "/var/log/fsck_apfs.log"
startup_position = "head"
multiline_mode = "none"

[[telemetry.logs.file_inputs]]
input_id = "macos_wifi"
path = "/var/log/wifi.log"
startup_position = "head"
multiline_mode = "none"
