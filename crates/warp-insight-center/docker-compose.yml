services:
  postgres:
    image: postgres:16
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: insight_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d insight_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres16-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  # 网关状态时序历史（Prometheus 兼容 TSDB；center 配置 WARP_INSIGHT_CENTER_VICTORIAMETRICS_URL 即推送）。
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.98.0
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics-data:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=6"   # 数据保留 6 个月
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres16-data:
  victoriametrics-data:
