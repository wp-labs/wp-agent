# WarpGateway 初始配置示例
# 基于安全注册机制的网关初始化配置（对应 GatewayInitialConfig 设计）：
#   ① 控制面连接  ② 注册上下文  ③ 身份与凭据  ④ 初始策略  ⑤ 遥测  ⑥ 版本/协议

[control_center]
endpoint = "https://warp-insight.example.com"
trust_bundle = "/etc/warp-gateway/ca/control-center.pem"
server_tls_required = true

[enrollment]
token_id = "gw-enroll-001"

[identity]
gateway_id = "gateway-001"
instance_id = "gateway-001/boot-20260811"

[credential]
credential_id = "credential-issued-001"
auth_scheme = "bearer"

[policy]
policy_version = "v1"
policy_binding_id = "default-gateway-policy"

[telemetry]
output = "warp-parse"
interval_seconds = 60

[version]
schema_version = "v1"
protocol_version = "1.0"
